[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "B008",  # FastAPI relies on function calls (Depends/Query) in argument defaults
    "UP046", # Generic[T] is pydantic's documented pattern for generic models
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning",
    # Starlette's TestClient warns that it wants httpx2; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
]
